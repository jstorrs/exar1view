<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Dev/hosted CSP; the single-file build replaces it with a hash-based one. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exar1view</title>
  <!-- build:css -->
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">exar1view</h1>
    <button type="button" id="split-view" class="btn" aria-pressed="false" title="Show two panes side by side">Split view</button>
    <button type="button" id="compare" class="btn" aria-disabled="true">Compare steps</button>
    <button type="button" id="compare-programs" class="btn" aria-disabled="true">Compare programs</button>
    <button type="button" id="analyze" class="btn" aria-disabled="true">Analyze</button>
    <span id="analysis" class="analysis" hidden><span id="analysis-progress"></span> <button type="button" id="analysis-cancel" class="btn btn-small" aria-label="Cancel analysis">Cancel</button></span>
    <button type="button" id="mark-upgrade" class="btn" aria-pressed="false" title="Mark the steps whose protocols have upgrade notes (after Analyze)">Mark upgrade notes</button>
    <button type="button" id="open" class="btn" title="Open .exar1 files (or drop them on the page)">Open…</button>
    <input type="file" id="file-input" accept=".exar1" multiple hidden>
  </header>
  <div id="errors" class="errors" role="alert" hidden></div>
  <div id="status" class="status"></div>
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <main id="app" class="app-main">
    <div id="empty-state" class="empty-state">
      <p class="empty-title">Drop .exar1 files here or press Open…</p>
      <p>Files are read in this browser only; nothing is uploaded or stored.</p>
    </div>
  </main>
  <section id="compare-panel" hidden></section>
  <section id="sequence-report" hidden></section>
  <section id="program-compare" hidden></section>
  <footer class="app-footer"><small id="sqlite-version"></small></footer>
  <!-- build:sqljs -->
  <script src="vendor/sql.js/sql-wasm.js"></script>
  <!-- build:app -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
